# Self-contained deployment: builds the app from git, creates the NL chart
# extract once, and serves both with nginx on host port 30250.
# Used as a TrueNAS custom app on "hive"; works with plain `docker compose up -d`.
services:
  build:
    image: node:22-alpine
    restart: "no"
    environment:
      REPO: https://github.com/cedricziel/plotter.git
      REF: main
      OUT: /out/www
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache curl >/dev/null && curl -fsSL "https://raw.githubusercontent.com/cedricziel/plotter/$$REF/deploy/build.sh" | sh
    volumes:
      - /mnt/hive/apps/plotter:/out
  tiles:
    image: alpine:3.22
    restart: "no"
    environment:
      REF: main
      OUT: /out/tiles
      MAXZOOM: "14"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache curl >/dev/null && curl -fsSL "https://raw.githubusercontent.com/cedricziel/plotter/$$REF/deploy/tiles.sh" | sh
    volumes:
      - /mnt/hive/apps/plotter:/out
  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      build:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    # Workers run as uid 568 ("apps" on TrueNAS), which the dataset ACL grants access to.
    command:
      - >-
        adduser -D -H -u 568 -s /sbin/nologin apps 2>/dev/null;
        sed -i 's/^user .*;/user apps;/' /etc/nginx/nginx.conf &&
        cp /out/www/.nginx.conf /etc/nginx/conf.d/default.conf &&
        exec nginx -g 'daemon off;'
    # Real HTTP requests through the workers: app shell, bundled font, chart range.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1/ &&
          wget -q -O /dev/null 'http://127.0.0.1/fonts/Noto%20Sans%20Regular/0-255.pbf' &&
          wget -S -O /dev/null --header 'Range: bytes=0-16383' http://127.0.0.1/tiles/netherlands.pmtiles 2>&1 | grep -q '206 Partial'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "30250:80"
    volumes:
      - /mnt/hive/apps/plotter:/out:ro
