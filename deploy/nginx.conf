# nginx site config for the Plotter image: the app from /usr/share/nginx/html,
# the PMTiles chart from the mounted /srv/tiles and /api/ proxied to the
# plotter-server container.
# TLS is terminated upstream (e.g. Pangolin), so this listens on plain HTTP.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The TLS proxy (newt) reaches this container over Docker's bridge network;
    # trust X-Forwarded-For only from there, not from LAN clients on the port.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Search, routing and offline corridors. The upstream name is resolved per
    # request (Docker's DNS) so nginx starts, and the app works, without it.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $plotter_api http://server:8080;
        proxy_pass $plotter_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
        add_header Cache-Control "no-store" always;
    }

    # PMTiles is read with HTTP Range requests (nginx supports them for static
    # files); expose the headers the pmtiles client inspects.
    location /tiles/ {
        alias /srv/tiles/;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, ETag" always;
        add_header Cache-Control "public, max-age=86400" always;
    }
    # Names the current chart file; must always be revalidated.
    location = /tiles/current.json {
        alias /srv/tiles/current.json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    types {
        application/manifest+json webmanifest;
        application/x-protobuf pbf;
        application/octet-stream pmtiles;
    }
    include /etc/nginx/mime.types;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
}
