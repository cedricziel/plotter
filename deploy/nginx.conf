# nginx config for serving the Plotter build (dist/) plus the PMTiles chart.
# TLS is terminated upstream (e.g. Pangolin), so this listens on plain HTTP.
server {
    listen 80;
    server_name _;
    root /out/www;
    index index.html;

    # PMTiles is read with HTTP Range requests (nginx supports them for static
    # files); expose the headers the pmtiles client inspects.
    location /tiles/ {
        alias /out/tiles/;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, ETag" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    types {
        application/manifest+json webmanifest;
        application/x-protobuf pbf;
        application/octet-stream pmtiles;
    }
    include /etc/nginx/mime.types;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
}
